<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>NekoImageConverter</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				max-width: 800px;
				margin: 40px auto;
				padding: 0 20px;
			}
			h1 {
				text-align: center;
			}
			#preview,
			#videoPreview {
				max-width: 100%;
				max-height: 400px;
				margin: 20px auto;
				display: block;
				border: 1px solid #ccc;
				object-fit: contain;
			}
			textarea {
				width: 100%;
				height: 200px;
				font-family: monospace;
				padding: 12px;
				box-sizing: border-box;
				resize: vertical;
			}
			.controls,
			.options {
				margin: 20px 0;
				text-align: center;
			}
			button,
			input[type='file'] {
				padding: 10px 20px;
				font-size: 1rem;
				margin: 8px;
			}
			#status {
				color: #555;
				text-align: center;
				min-height: 1.5em;
			}
			#copyBtn:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}
			#fpsOption {
				display: none;
				margin-top: 10px;
			}
			#progressContainer {
				display: none;
				margin: 15px 0;
			}
			#progressBar {
				width: 100%;
				height: 12px;
			}
		</style>
	</head>
	<body>
		<h1>NekoImageConverter</h1>

		<div style="text-align: center; margin-bottom: 20px">
			<input type="file" id="fileInput" accept="image/*,video/*" />
		</div>

		<img id="preview" alt="プレビュー" style="display: none" />
		<video id="videoPreview" controls style="display: none"></video>

		<div class="controls">
			<button id="convertBtn" disabled>変換</button>
			<button id="copyBtn" disabled>結果をコピー</button>
		</div>

		<div class="options">
			<input id="resizeChk" type="checkbox" checked />
			<label for="resizeChk">自動で480x360以下にリサイズする</label>
			<div id="fpsOption">
				<label
					>FPS
					<input
						id="fpsInput"
						type="number"
						min="1"
						max="60"
						value="30"
				/></label>
			</div>
		</div>

		<textarea
			id="result"
			placeholder="変換結果はここに表示されます..."
			readonly
		></textarea>
		<div id="status"></div>

		<div id="progressContainer">
			<progress id="progressBar" value="0" max="100"></progress>
			<div id="progressText"></div>
		</div>

		<script>
			const VER = {
				Image: 1,
				Video: 1,
			};
			let ImageCode = '';

			function getPixelHexArray(imageData) {
				const data = imageData.data;
				const length = data.length / 4;
				const Pixels = new Array(length);
				for (let i = 0, j = 0; i < data.length; i += 4, j++) {
					Pixels[j] =
						data[i].toString(16).padStart(2, '0') +
						data[i + 1].toString(16).padStart(2, '0') +
						data[i + 2].toString(16).padStart(2, '0') +
						data[i + 3].toString(16).padStart(2, '0');
				}
				return Pixels;
			}

			function compressPixels(Pixels, sharedLink = null) {
				const Link = sharedLink || [];
				const colorToIndex = new Map(Link.map((c, i) => [c, i]));

				let Data = '';
				if (Pixels.length === 0) return { Link, Data: '' };

				let L = Pixels[0];
				let LC = 1;
				if (!colorToIndex.has(L)) {
					colorToIndex.set(L, Link.length);
					Link.push(L);
				}

				for (let i = 1; i < Pixels.length; i++) {
					const now = Pixels[i];
					if (now === L) {
						LC++;
					} else {
						Data += `${colorToIndex.get(L) + 1}.${LC}.`;
						L = now;
						LC = 1;
						if (!colorToIndex.has(L)) {
							colorToIndex.set(L, Link.length);
							Link.push(L);
						}
					}
				}
				Data += `${colorToIndex.get(L) + 1}.${LC}.`;
				return { Link, Data };
			}

			async function resizeImage(url, maxWidth = 480, maxHeight = 360) {
				return new Promise((resolve, reject) => {
					const img = new Image();
					img.crossOrigin = 'anonymous';
					img.onload = () => {
						let { naturalWidth: w, naturalHeight: h } = img;
						if (w > maxWidth || h > maxHeight) {
							const scale = Math.min(maxWidth / w, maxHeight / h);
							w = Math.round(w * scale);
							h = Math.round(h * scale);
						}
						const canvas = document.createElement('canvas');
						canvas.width = w;
						canvas.height = h;
						canvas.getContext('2d').drawImage(img, 0, 0, w, h);
						resolve(canvas.toDataURL('image/png'));
					};
					img.onerror = () => reject(new Error('画像読み込み失敗'));
					img.src = url;
				});
			}

			async function ImageToNekoImage(URL) {
				const img = new Image();
				img.crossOrigin = 'anonymous';
				await new Promise((r, e) => {
					img.onload = r;
					img.onerror = () =>
						e(new Error(`画像読み込み失敗: ${URL}`));
					img.src = URL;
				});

				const canvas = document.createElement('canvas');
				canvas.width = img.width;
				canvas.height = img.height;
				const ctx = canvas.getContext('2d');
				ctx.drawImage(img, 0, 0);

				const Pixels = getPixelHexArray(
					ctx.getImageData(0, 0, canvas.width, canvas.height),
				);
				const { Link, Data } = compressPixels(Pixels);
				return `${VER.Image}.${canvas.width}.${canvas.height},${Link.join('')},${Data}`;
			}

			async function VideoToNekoVideo(
				videoURL,
				fps,
				maxWidth = 480,
				maxHeight = 360,
				onProgress,
			) {
				const video = document.createElement('video');
				video.crossOrigin = 'anonymous';
				video.src = videoURL;
				video.muted = true;
				video.playsInline = true;

				await new Promise((resolve, reject) => {
					video.onloadedmetadata = resolve;
					video.onerror = () => reject(new Error('動画読み込み失敗'));
				});

				let width = video.videoWidth,
					height = video.videoHeight;
				if (width > maxWidth || height > maxHeight) {
					const scale = Math.min(
						maxWidth / width,
						maxHeight / height,
					);
					width = Math.round(width * scale);
					height = Math.round(height * scale);
				}

				const canvas = document.createElement('canvas');
				canvas.width = width;
				canvas.height = height;
				const ctx = canvas.getContext('2d');

				const Link = [];
				const frameDatas = [];
				const frameInterval = 1 / fps;
				const duration = video.duration;
				const totalFrames = Math.ceil(duration * fps);

				const startTime = Date.now();

				for (let i = 0; i < totalFrames; i++) {
					const currentFrame = i + 1;
					const currentTime = Math.min(i * frameInterval, duration);
					video.currentTime = currentTime;

					await new Promise((resolve) => {
						video.onseeked = resolve;
					});

					ctx.drawImage(video, 0, 0, width, height);
					const Pixels = getPixelHexArray(
						ctx.getImageData(0, 0, width, height),
					);
					const { Data } = compressPixels(Pixels, Link);
					frameDatas.push(Data);

					// 進捗
					if (document.visibilityState === 'visible') {
						const percent = Math.round(
							(currentFrame / totalFrames) * 100,
						);
						const elapsed = Date.now() - startTime;
						const remainingSec = Math.round(
							((elapsed / currentFrame) *
								(totalFrames - currentFrame)) /
								1000,
						);

						if (onProgress)
							onProgress(
								currentFrame,
								totalFrames,
								percent,
								remainingSec,
							);
					}
				}

				return `${VER.Video}.${width}.${height}.${fps},${Link.join('')},${frameDatas.join(';')};`;
			}

			const fileInput = document.getElementById('fileInput');
			const preview = document.getElementById('preview');
			const videoPreview = document.getElementById('videoPreview');
			const convertBtn = document.getElementById('convertBtn');
			const copyBtn = document.getElementById('copyBtn');
			const resizeChk = document.getElementById('resizeChk');
			const fpsOption = document.getElementById('fpsOption');
			const fpsInput = document.getElementById('fpsInput');
			const resultArea = document.getElementById('result');
			const status = document.getElementById('status');
			const progressContainer =
				document.getElementById('progressContainer');
			const progressBar = document.getElementById('progressBar');
			const progressText = document.getElementById('progressText');

			let currentBlobURL = null;
			let isVideo = false;

			fileInput.addEventListener('change', () => {
				const file = fileInput.files[0];
				if (!file) {
					convertBtn.disabled = true;
					return;
				}

				if (currentBlobURL) URL.revokeObjectURL(currentBlobURL);
				currentBlobURL = URL.createObjectURL(file);
				isVideo = file.type.startsWith('video/');

				preview.style.display = isVideo ? 'none' : 'block';
				videoPreview.style.display = isVideo ? 'block' : 'none';
				fpsOption.style.display = isVideo ? 'block' : 'none';
				progressContainer.style.display = 'none';
				resultArea.value = '';
				copyBtn.disabled = true;

				if (isVideo) {
					videoPreview.src = currentBlobURL;
					videoPreview.onloadedmetadata = () => {
						status.textContent = `動画サイズ: ${videoPreview.videoWidth}x${videoPreview.videoHeight} / ${videoPreview.duration.toFixed(1)}秒`;
						convertBtn.disabled = false;
					};
				} else {
					preview.src = currentBlobURL;
					preview.onload = () => {
						status.textContent = `画像サイズ: ${preview.naturalWidth}x${preview.naturalHeight}`;
						convertBtn.disabled = false;
					};
				}
			});

			convertBtn.addEventListener('click', async () => {
				if (!currentBlobURL) return;

				convertBtn.disabled = true;
				copyBtn.disabled = true;
				resultArea.value = '';
				progressContainer.style.display = isVideo ? 'block' : 'none';
				progressBar.value = 0;

				status.textContent = '変換中...';

				try {
					let nekoStr;
					if (isVideo) {
						const fps = parseInt(fpsInput.value) || 30;
						nekoStr = await VideoToNekoVideo(
							currentBlobURL,
							fps,
							resizeChk.checked ? 480 : Infinity,
							resizeChk.checked ? 360 : Infinity,
							(cur, tot, pct, rem) => {
								progressBar.value = pct;
								progressText.textContent = `${cur}/${tot} (${pct}%) 残り約${rem}秒`;
							},
						);
					} else {
						let url = currentBlobURL;
						if (resizeChk.checked) url = await resizeImage(url);
						nekoStr = await ImageToNekoImage(url);
					}

					if (nekoStr.length > 1000000) {
						resultArea.value =
							'サイズが大きすぎるため、プレビューを表示しません。';
					} else {
						resultArea.value = nekoStr;
					}
					ImageCode = nekoStr;
					copyBtn.disabled = false;
					status.textContent = `変換完了（${nekoStr.length.toLocaleString()}文字）`;
				} catch (err) {
					console.error(err);
					status.textContent = `エラー: ${err.message}`;
				} finally {
					convertBtn.disabled = false;
					progressContainer.style.display = 'none';
				}
			});

			copyBtn.addEventListener('click', async () => {
				const text = ImageCode.trim();
				if (!text) return;
				try {
					await navigator.clipboard.writeText(text);
					status.textContent = 'クリップボードにコピーしました';
				} catch {
					status.textContent =
						'コピーに失敗しました。手動で選択してコピーしてください';
				}
			});
		</script>
	</body>
</html>
