    <h1>NyankoBot@miroTalk</h1>
    <p>下のリンクをブックマークバー(見えなかったらCtrl+Shift+Bで表示できるよ)にドラッグアンドドロップしてね!</p>
    <p><a href="javascript:(function(){if(!window.uANCtx){window.uANCtx={};}if(window.uANCtx.run){if(typeof window.uANCtx.stop===&quot;function&quot;){window.uANCtx.stop();}}else{window.uANCtx.run=true;const BOT_NAME=&apos;NyankoBot@MiroTalk&apos;,CMD_PREFIX=&apos;n!&apos;,VERSION=&apos;1.8&apos;,AUTHOR=&apos;ユーザー&apos;;const wMT=`{USER}さんが入室しました`,fMT=`{USER}さんが退出しました`;const pLE=document.getElementById(&quot;participantsList&quot;),cIE=document.getElementById(&quot;chatMessage&quot;),cSBE=document.getElementById(&quot;chatSendButton&quot;),cBUE=document.getElementById(&quot;chatButton&quot;),cRE=document.getElementById(&quot;chatRoom&quot;),cPMs=document.getElementById(&quot;chatPublicMessages&quot;);if(!pLE||!cIE||!cSBE||!cBUE||!cRE||!cPMs){alert(&quot;必要なHTML要素が見つかりません。&quot;);window.uANCtx.run=false;return;}if(cRE.classList.contains(&quot;hidden&quot;)){cBUE.click();}let prevPs=new Map();let lastProcessedMsgId=null;const getCPs=()=&gt;{const cM=new Map();const pEs=pLE.querySelectorAll(&quot;li[data-to-id][data-to-name]&quot;);pEs.forEach(el=&gt;{const uId=el.id,uN=el.dataset.toName;if(uId&amp;&amp;uN&amp;&amp;uId!==&quot;all&quot;&amp;&amp;uId!==&quot;ChatGPT&quot;&amp;&amp;uId!==&quot;DeepSeek&quot;){cM.set(uId,uN);}});return cM;};const getMPI=()=&gt;{const mNEs=document.querySelectorAll(&quot;#videoMediaContainer div.Camera p.username&quot;);for(const p of mNEs){if(p.textContent.includes(&quot;(me)&quot;)){const cD=p.closest(&quot;div.Camera&quot;);if(cD&amp;&amp;cD.id)return cD.id.split(&quot;__&quot;)[0];}}if(typeof rc!==&quot;undefined&quot;&amp;&amp;rc.myPeerId){return rc.myPeerId;}return null;};const sendM=(msg, isCommandResponse=false)=&gt;{const originalMsgValue=cIE.value;cIE.value=msg;cSBE.click();if(!isCommandResponse)cIE.value=originalMsgValue;};const commands={help:{desc:&apos;コマンドのヘルプを表示します。&apos;,usage:&apos;help [command_name]&apos;,aliases:[&quot;h&quot;,&quot;info&quot;]},say:{desc:&apos;指定されたメッセージをそのまま返します。&apos;,usage:&apos;say &lt;message&gt;&apos;,aliases:[]},scpro:{desc:&apos;Scratchプロジェクトの情報を取得します。&apos;,usage:&apos;scpro &lt;project_id&gt;&apos;,aliases:[&quot;scratchproject&quot;]}};const handleCmd=async(cmdMsgText,msgAuthor)=&gt;{if(msgAuthor===BOT_NAME)return;if(!cmdMsgText.startsWith(CMD_PREFIX))return;const rawArgs=cmdMsgText.substring(CMD_PREFIX.length).trim();const args=rawArgs.split(/\s+/);const cmdInput=args.shift().toLowerCase();let cmdKey=null;for(const key in commands){if(key===cmdInput||commands[key].aliases.includes(cmdInput)){cmdKey=key;break;}}if(!cmdKey){sendM(`コマンド &apos;${cmdInput}&apos; は見つかりません。 ${CMD_PREFIX}help でコマンド一覧を確認できます。`,true);return;}const command=commands[cmdKey];const messageContent=rawArgs.substring(cmdInput.length+(rawArgs.startsWith(cmdInput+&quot; &quot;)?1:0)).trim();if(cmdKey===&quot;help&quot;){const helpArg=args[0]?args[0].toLowerCase():null;let helpText=`${BOT_NAME} Help (v${VERSION}):\nPrefix: ${CMD_PREFIX}\n\n`;if(helpArg){let foundCmdKey=null;for(const key in commands){if(key===helpArg||commands[key].aliases.includes(helpArg)){foundCmdKey=key;break;}}if(foundCmdKey){const c=commands[foundCmdKey];helpText+=`Command: ${foundCmdKey}\nAliases: ${c.aliases.join(&quot;, &quot;) || &quot;なし&quot;}\nDescription: ${c.desc}\nUsage: ${CMD_PREFIX}${c.usage}`;}else{helpText+=`コマンド &apos;${helpArg}&apos; は見つかりません。\n利用可能なコマンド:\n`;for(const cName in commands){helpText+=`  ${CMD_PREFIX}${commands[cName].usage} - ${commands[cName].desc}\n`;}}}else{helpText+=&apos;利用可能なコマンド:\n&apos;;for(const cName in commands){helpText+=`  ${CMD_PREFIX}${commands[cName].usage} - ${commands[cName].desc}\n`;}}sendM(helpText,true);}else if(cmdKey===&quot;say&quot;){if(messageContent){sendM(messageContent,true);}else{sendM(`使用法: ${CMD_PREFIX}${command.usage}`,true);}}else if(cmdKey===&quot;scpro&quot;){const projectId=args[0];if(projectId&amp;&amp;/^\d+$/.test(projectId)){try{const response=await fetch(`https://trampoline.turbowarp.org/api/projects/${projectId}`);if(!response.ok){throw new Error(`API Error: ${response.status} ${response.statusText}`);}const data=await response.json();const projectInfo=`Scratch Project Info (ID: ${projectId}):\n - Title: ${data.title}\n - Author: ${data.username}\n - Views: ${data.stats?.views || &quot;N/A&quot;}\n - Loves: ${data.stats?.loves || &quot;N/A&quot;}\n - Remixes: ${data.stats?.remixes || &quot;N/A&quot;}`;sendM(projectInfo,true);}catch(error){sendM(`Error fetching Scratch project ${projectId}: ${error.message}`,true);console.error(&apos;SCPRO Error:&apos;,error);}}else{sendM(`使用法: ${CMD_PREFIX}${command.usage}\n有効なプロジェクトIDを指定してください。`,true);}}};prevPs=getCPs();const mPI=getMPI();const participantObserver=new MutationObserver(function(mSL){const curPs=getCPs();curPs.forEach((uN,uId)=&gt;{if(!prevPs.has(uId)&amp;&amp;uId!==mPI){const finalMsg=wMT.replace(&quot;{USER}&quot;,uN);sendM(finalMsg);}});prevPs.forEach((uN,uId)=&gt;{if(!curPs.has(uId)&amp;&amp;uId!==mPI){const finalMsg=fMT.replace(&quot;{USER}&quot;,uN);sendM(finalMsg);}});prevPs=new Map(curPs);});participantObserver.observe(pLE,{childList:true});const chatMsgObserver=new MutationObserver((mutations)=&gt;{for(const mutation of mutations){if(mutation.addedNodes.length&gt;0){mutation.addedNodes.forEach(node=&gt;{if(node.nodeType===Node.ELEMENT_NODE&amp;&amp;node.tagName===&quot;LI&quot;&amp;&amp;node.id&amp;&amp;node.id.startsWith(&quot;msg-&quot;)){const msgId=node.id;if(msgId===lastProcessedMsgId)return;lastProcessedMsgId=msgId;const msgContentEl=node.querySelector(&quot;.message &gt; span&quot;);const msgAuthorEl=node.querySelector(&quot;.message-data &gt; span&quot;);let msgAuthorName=&apos;Unknown&apos;;if(msgAuthorEl){const authorText=msgAuthorEl.textContent.trim();const parts=authorText.split(&quot;,&quot;);if(parts.length&gt;1)msgAuthorName=parts[1].trim().replace(/\( me \)$/,&quot;&quot;).trim(); else if(parts.length === 1) msgAuthorName = parts[0].trim().replace(/\( me \)$/,&quot;&quot;).trim();}if(msgContentEl){const msgText=msgContentEl.textContent.trim();if(msgAuthorName!==BOT_NAME){handleCmd(msgText,msgAuthorName);}}}});}}});chatMsgObserver.observe(cPMs,{childList:true,subtree:true});window.uANCtx.participantObs=participantObserver;window.uANCtx.chatMsgObs=chatMsgObserver;alert(BOT_NAME+&quot; が起動しました (v&quot;+VERSION+&quot;).\nコマンドプレフィックス: &quot;+CMD_PREFIX+&quot;\nチャットウィンドウは開いたままになります。\nブックマークレットを再度実行すると停止します。&quot;);window.uANCtx.stop=function(){if(window.uANCtx.participantObs){window.uANCtx.participantObs.disconnect();delete window.uANCtx.participantObs;}if(window.uANCtx.chatMsgObs){window.uANCtx.chatMsgObs.disconnect();delete window.uANCtx.chatMsgObs;}window.uANCtx.run=false;alert(BOT_NAME+&quot; を停止しました。&quot;);};}})();">NyankoBot@MiroTalk</a></p>
